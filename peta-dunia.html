<style>

  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; color:var(--ink); overflow:hidden; background:#080a12; }

  .nav{ position:fixed; top:0; left:0; right:0; height:48px; background:var(--navy); display:flex; align-items:center;
    padding:0 16px; gap:10px; z-index:2000; }
  .nav a{ display:flex; align-items:center; gap:6px; color:rgba(255,255,255,0.82); text-decoration:none; font-size:13px; padding:6px 11px; border-radius:6px; }

  .nav .brand{ font-weight:700; color:var(--gold); font-size:13px; letter-spacing:.03em; margin-left:auto; }
  @media(max-width:680px){ .nav .brand{ display:none; } }
  .nav .brand b{ color:#fff; font-weight:400; }
  .nav .badge{ background:rgba(212,175,106,0.16); color:var(--gold); font-size:11px; font-weight:700; padding:4px 10px; border-radius:100px; border:1px solid rgba(212,175,106,.3); text-decoration:none; }

  #map{ position:fixed; top:48px; left:0; right:0; bottom:0; }

  .panel{ position:fixed; top:62px; left:14px; z-index:1500; width:288px; max-width:calc(100vw - 28px);
    background:rgba(15,18,32,0.9); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 16px 40px rgba(0,0,0,0.5);
    max-height:calc(100vh - 80px); overflow-y:auto; transition:transform .35s cubic-bezier(.16,1,.3,1), opacity .3s; }
  .panel.hidden{ transform:translateX(calc(-100% - 24px)); opacity:0; pointer-events:none; }
  .panel h1{ font-size:17px; color:#fff; font-weight:700; padding-right:24px; } .panel h1 b{ color:var(--gold); }
  .panel .sub{ font-size:11.5px; color:var(--mute); margin:4px 0 14px; line-height:1.5; } .panel .sub b{ color:#cdd3e4; font-weight:600; }
  .panel-hide{ position:absolute; top:14px; right:14px; width:24px; height:24px; border-radius:7px; cursor:pointer;
    background:rgba(255,255,255,0.06); border:1px solid var(--line); color:var(--mute); font-size:16px; line-height:1;
    display:flex; align-items:center; justify-content:center; } .panel-hide:hover{ color:#fff; border-color:var(--gold); }
  .panel-show{ position:fixed; top:62px; left:14px; z-index:1500; width:44px; height:44px; border-radius:12px; cursor:pointer;
    background:rgba(15,18,32,0.92); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border:1px solid var(--line);
    color:var(--gold); font-size:18px; display:none; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(0,0,0,0.4); }
  .panel-show.show{ display:flex; } .panel-show:hover{ border-color:var(--gold); }

  /* (segmented Dunia/Indonesia dihapus — tombol "Detail Indonesia" di nav yang dipakai) */
  .story{ margin-top:10px; padding:13px 15px; background:linear-gradient(135deg,rgba(212,175,106,0.1),rgba(212,175,106,0.03));
    border:1px solid rgba(212,175,106,0.3); border-radius:11px; }
  .story-h{ font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--gold); font-weight:800; margin-bottom:8px; display:flex; align-items:center; gap:7px; }
  .story ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .story li{ font-size:12.5px; line-height:1.55; color:#cfd4e4; padding-left:18px; position:relative; }

  .story li b{ color:#fff; } .story li .g{ color:#7ddc8a; } .story li .f{ color:#d9a06a; }
  select,#country-search{ width:100%; padding:9px 11px; border-radius:10px; background:#0c0f1d; color:var(--ink);

  .mini{ margin-top:12px; background:#0c0f1d; border:1px solid var(--line); border-radius:11px; padding:11px 12px; }

  .actions{ display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .btn-mix{ width:100%; padding:11px; border:none; border-radius:10px; cursor:pointer;

  .btn-mix:hover{ transform:translateY(-1px); box-shadow:0 8px 20px rgba(212,175,106,.3); }

  .actions-row{ display:flex; gap:8px; } .actions-row .btn-src{ flex:1; padding:10px 8px; }
  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); z-index:4000;

  .srcgrid{ display:grid; gap:10px; }

  .srcused{ border-color:rgba(44,160,44,0.45); } .srcused .stt::after{ content:' ✓ dipakai'; color:#4cc94c; font-size:10px; font-weight:700; }

  #detail{ position:fixed; right:14px; top:62px; z-index:1500; width:300px; max-width:calc(100vw - 28px);
    background:rgba(16,19,34,0.96); border:1px solid var(--line); border-radius:14px; padding:16px; display:none;

  .jlink{ display:flex; align-items:center; gap:8px; margin-top:14px; background:linear-gradient(135deg,#c9a96e,#a07840);
    color:#1a1d2e; text-decoration:none; padding:10px 13px; border-radius:9px; font-size:13px; font-weight:700; }

  .modal-bd{ position:fixed; inset:0; background:rgba(8,10,18,0.82); z-index:3000; display:none; align-items:center;
    justify-content:center; padding:20px; -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); }
  .modal-bd.show{ display:flex; }
  .modal{ background:#11142a; border:1px solid var(--line); border-radius:14px; padding:26px; max-width:580px; width:100%;
    max-height:86vh; overflow-y:auto; }
  .modal h2{ color:#fff; font-size:21px; margin-bottom:4px; } .modal h2 b{ color:var(--gold); }
  .modal h3{ color:var(--gold); font-size:12px; text-transform:uppercase; letter-spacing:.08em; margin:18px 0 10px; }
  .modal p{ font-size:13px; color:var(--mute); line-height:1.55; }
  .sbar{ display:flex; height:20px; border-radius:6px; overflow:hidden; background:#222; margin:6px 0; }
  .mrow{ margin-bottom:10px; } .mrh{ display:flex; align-items:center; gap:7px; font-size:12.5px; }
  .mdot{ width:11px; height:11px; border-radius:50%; display:inline-block; } .mname{ flex:1; }
  .mtrack{ height:8px; background:rgba(255,255,255,0.08); border-radius:4px; overflow:hidden; margin:5px 0 4px; }
  .mbar{ height:100%; border-radius:4px; } .mmeta{ font-size:11px; color:#899; }
  .ctable{ width:100%; border-collapse:collapse; font-size:12.5px; margin-top:4px; }
  .ctable td,.ctable th{ padding:5px 6px; border-bottom:1px solid var(--line); text-align:left; }
  .ctable th{ color:var(--mute); font-weight:600; font-size:11px; text-transform:uppercase; }
  .ctable td.n{ text-align:right; font-variant-numeric:tabular-nums; }
  .modal .closeb{ margin-top:18px; padding:9px 18px; background:var(--gold); color:#1a1d2e; border:none; border-radius:8px; cursor:pointer; font-weight:700; }

  #loading{ position:fixed; inset:48px 0 0 0; z-index:1800; display:flex; align-items:center; justify-content:center;
    background:#080a12; color:var(--mute); flex-direction:column; gap:14px; font-size:14px; }
  .spin{ width:34px; height:34px; border:3px solid rgba(212,175,106,0.25); border-top-color:var(--gold); border-radius:50%; animation:sp .9s linear infinite; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  #errbox{ position:fixed; inset:48px 0 0 0; z-index:1900; display:none; align-items:center; justify-content:center; background:#080a12; color:#cdd; padding:30px; text-align:center; }
  @media(max-width:560px){ .panel{ width:calc(100vw - 28px); max-height:62vh; } #detail{ width:calc(100vw - 28px); top:auto; bottom:14px; } }
</style>

<script src="peta-dunia/world-plants.js"></script>
<script src="peta-dunia/world-grid.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin=""></script>
<script src="https://unpkg.com/deck.gl@9.0.36/dist.min.js" crossorigin=""></script>

<script>
(function(){
  if(!window.maplibregl || !window.deck || !window.WORLD_PLANTS){
    document.getElementById('loading').style.display='none';
    const e=document.getElementById('errbox'); e.style.display='flex';
    e.innerHTML='Gagal memuat peta/dataset dunia. Periksa koneksi lalu muat ulang.<br><br><a href="peta-kelistrikan.html" style="color:#d4af6a;">↩ Peta Indonesia</a>';
    throw new Error('deps missing');
  }
})();

// ============================================================
// DATA
// ============================================================
const WP=window.WORLD_PLANTS, FUELS=WP.fuels, COUNTRIES=WP.countries;
// [name, iso3, mw, lat, lon, fuelIdx]  → objek ringan
const PLANTS=WP.plants.map(p=>({name:p[0],iso:p[1],mw:p[2],lat:p[3],lon:p[4],fuel:FUELS[p[5]]}));

// Jaringan interkoneksi antar-negara/region (The Global Transmission Database, MIT)
// nodes: { "IDN-XX":[lat,lon,countryName] }  edges: [fromId,toId,existMW,planMW]
const GRID = window.WORLD_GRID || {nodes:{},edges:[]};
const ARCS = GRID.edges.map(e=>{
  const a=GRID.nodes[e[0]], b=GRID.nodes[e[1]]; if(!a||!b) return null;
  return { s:[a[1],a[0]], t:[b[1],b[0]], fromIso:e[0].slice(0,3), toIso:e[1].slice(0,3),
           fromC:a[2], toC:b[2], ex:e[2], pl:e[3] };
}).filter(Boolean);

const FUEL_COLOR={
  'Coal':'#4a4a55','Gas':'#e08a3c','Oil':'#8c6a4a','Petcoke':'#6b5a4a','Cogeneration':'#7a6a55',
  'Hydro':'#3a8fd0','Solar':'#f2c200','Wind':'#36c2c9','Geothermal':'#d05a4a',
  'Nuclear':'#b06ad0','Biomass':'#6fae3a','Waste':'#8b6f3a','Wave and Tidal':'#2a9d8f',
  'Storage':'#8893a8','Other':'#6c7486',
};
const EBT=new Set(['Hydro','Solar','Wind','Geothermal','Biomass','Waste','Wave and Tidal']);
const FOSSIL=new Set(['Coal','Gas','Oil','Petcoke','Cogeneration']);
function bucket(f){ return EBT.has(f)?'ebt':(f==='Nuclear'?'nuklir':(FOSSIL.has(f)?'fosil':'lain')); }
function hexRgb(h){ h=(h||'#888').replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }

// Pemetaan ke jalur Academy
const FUEL_JALUR={'Solar':'S10','Coal':'S7','Gas':'S7','Oil':'S7','Hydro':'S7','Geothermal':'S7','Wind':'S7',
  'Nuclear':'S7','Biomass':'S7','Waste':'S13','Petcoke':'S7','Cogeneration':'S7','Storage':'S15'};
const JALUR_LABEL={S7:'Pembangkitan & Renewable',S10:'PV & Solar Engineer',S13:'Waste to Energy',S15:'Baterai & BESS'};

// ============================================================
// LEGEND + COUNTRY SELECT
// ============================================================
// Restore state dari URL hash (permalink)
function parseHash(){
  const p=new URLSearchParams(location.hash.slice(1));
  const num=v=>{ const n=parseFloat(v); return isFinite(n)?n:undefined; };
  return { c:p.get('c')||'', f:p.get('f')==='1', g:p.get('g')==='1', pl:p.get('p')==='1', d:p.get('d')==='1',
           z:num(p.get('z')), y:num(p.get('y')), x:num(p.get('x')) };
}
const INIT=parseHash();
const NAME2ISO={}; Object.keys(COUNTRIES).forEach(c=>NAME2ISO[COUNTRIES[c].toLowerCase()]=c);

(function(){
  const present=[...new Set(PLANTS.map(p=>p.fuel))].sort();
  document.getElementById('legend').innerHTML=present.map(f=>`<span><i style="background:${FUEL_COLOR[f]||'#888'}"></i>${f}</span>`).join('');
  const counts={}; PLANTS.forEach(p=>counts[p.iso]=(counts[p.iso]||0)+1);
  const sel=document.getElementById('country');
  const sorted=Object.keys(COUNTRIES).sort((a,b)=>COUNTRIES[a].localeCompare(COUNTRIES[b]));
  sel.innerHTML='<option value="">🌍 Semua negara ('+PLANTS.length.toLocaleString('id-ID')+')</option>'
    + sorted.map(c=>`<option value="${c}">${COUNTRIES[c]} (${(counts[c]||0).toLocaleString('id-ID')})</option>`).join('');
  sel.addEventListener('change',()=>{ state.country=sel.value; syncSearch(); syncSeg(); refresh(true); });
  // kotak cari (datalist)
  document.getElementById('country-dl').innerHTML=sorted.map(c=>`<option value="${COUNTRIES[c]}">`).join('');
  const search=document.getElementById('country-search');
  search.addEventListener('change',()=>{
    const iso=NAME2ISO[search.value.trim().toLowerCase()];

function currentArcs(){
  let a=ARCS.filter(x=>x.ex>0);
  if(state.country) a=a.filter(x=>x.fromIso===state.country||x.toIso===state.country);
  return a;
}

function currentData(){
  let d=PLANTS;
  if(state.country) d=d.filter(p=>p.iso===state.country);
  if(state.ebtOnly) d=d.filter(p=>EBT.has(p.fuel));
  return d;
}

function refresh(fly){
  if(!overlay) return;
  const data=currentData();
  const layers=[];
  if(state.mode3d){
    layers.push(new deck.ColumnLayer({ id:'plants', data, pickable:true, diskResolution:10, extruded:true,
      radius: state.country?2500:9000, getPosition:d=>[d.lon,d.lat],
      getElevation:d=>d.mw, elevationScale: state.country?40:60,
      getFillColor:d=>{ const c=hexRgb(FUEL_COLOR[d.fuel]||'#888'); return [c[0],c[1],c[2],230]; },
      onClick:info=>info.object&&showDetail(info.object) }));
  } else {
    layers.push(new deck.ScatterplotLayer({ id:'plants', data, pickable:true,
      getPosition:d=>[d.lon,d.lat], getRadius:d=>Math.sqrt(Math.max(d.mw,1))*180,
      radiusUnits:'meters', radiusMinPixels:1.5, radiusMaxPixels:22, opacity:0.82, stroked:false,
      getFillColor:d=>{ const c=hexRgb(FUEL_COLOR[d.fuel]||'#888'); return [c[0],c[1],c[2],210]; },
      onClick:info=>info.object&&showDetail(info.object) }));
  }
  // Jaringan interkoneksi (arc) — di atas titik pembangkit
  if(state.grid){
    const arcs=currentArcs();
    if(state.gridPlanned){
      const planned=(state.country? ARCS.filter(x=>x.pl>0 && (x.fromIso===state.country||x.toIso===state.country)) : ARCS.filter(x=>x.pl>0));
      layers.push(new deck.ArcLayer({ id:'grid-planned', data:planned, pickable:true,
        getSourcePosition:d=>d.s, getTargetPosition:d=>d.t,
        getSourceColor:[90,140,208,150], getTargetColor:[90,140,208,150],
        getWidth:d=>Math.max(1,Math.sqrt(d.pl)/22), widthMinPixels:0.8, widthMaxPixels:6, getHeight:0.25 }));
    }
    layers.push(new deck.ArcLayer({ id:'grid-existing', data:arcs, pickable:true,
      getSourcePosition:d=>d.s, getTargetPosition:d=>d.t,
      getSourceColor:[212,175,106,210], getTargetColor:[212,175,106,150],
      getWidth:d=>Math.max(1,Math.sqrt(d.ex)/20), widthMinPixels:1, widthMaxPixels:8, getHeight:0.3 }));
  }
  overlay.setProps({layers});
  document.getElementById('readout').textContent =
    `${data.length.toLocaleString('id-ID')} pembangkit · ${Math.round(data.reduce((a,p)=>a+p.mw,0)/1000).toLocaleString('id-ID')} GW`
    + (state.grid? ' · '+currentArcs().length+' interkoneksi':'')
    + (state.country? ' · '+(COUNTRIES[state.country]||state.country):' · global');
  renderMini(); writeHash();

  if(fly && data.length){
    let minx=180,miny=90,maxx=-180,maxy=-90;
    for(const p of data){ if(p.lon<minx)minx=p.lon; if(p.lon>maxx)maxx=p.lon; if(p.lat<miny)miny=p.lat; if(p.lat>maxy)maxy=p.lat; }
    try{ map.fitBounds([[minx,miny],[maxx,maxy]],{padding:60,maxZoom:7,duration:800}); }catch(e){}
  } else if(fly && !state.country){
    map.easeTo({center:[20,25],zoom:1.4,duration:800});
  }
}

function buildHash(){

function mixOf(list){
  const byFuel={}, byBucket={ebt:0,fosil:0,nuklir:0,lain:0}; let total=0;
  for(const p of list){ byFuel[p.fuel]=(byFuel[p.fuel]||0)+p.mw; byBucket[bucket(p.fuel)]+=p.mw; total+=p.mw; }
  return {byFuel,byBucket,total,count:list.length};
}
function gridInsightHTML(scope){
  if(!ARCS.length) return '';
  let list=ARCS;
  if(scope) list=ARCS.filter(x=>x.fromIso===scope||x.toIso===scope);
  if(!list.length) return '';
  const ex=list.reduce((a,x)=>a+x.ex,0), pl=list.reduce((a,x)=>a+x.pl,0);
  const fmt=n=>Math.round(n).toLocaleString('id-ID');
  const top=list.filter(x=>x.ex>0).sort((a,b)=>b.ex-a.ex).slice(0,5)
    .map(x=>`<tr><td>${x.fromC} ↔ ${x.toC}</td><td class="n">${fmt(x.ex/1000)} GW</td></tr>`).join('');
  return `<h3>Jaringan Interkoneksi ${scope?'· '+(COUNTRIES[scope]||scope):''}</h3>
    <p>${list.length} koneksi · kapasitas existing <strong>${fmt(ex/1000)} GW</strong>${pl?` · rencana +${fmt(pl/1000)} GW`:''}.</p>
    ${top?`<table class="ctable"><tr><th>Koneksi</th><th class="n">Existing</th></tr>${top}</table>`:''}`;
}

const CONTINENT_OF={};
'AFG ARE ARM AZE BGD BHR BRN BTN CHN CYP GEO IDN IND IRN IRQ ISR JOR JPN KAZ KGZ KHM KOR KWT LAO LBN LKA MMR MNG MYS NPL OMN PAK PHL PRK PSE QAT SAU SGP SYR THA TJK TKM TUR TWN UZB VNM YEM'.split(' ').forEach(c=>CONTINENT_OF[c]='Asia');
'ALB AUT BEL BGR BIH BLR CHE CZE DEU DNK ESP EST FIN FRA GBR GRC HRV HUN IRL ISL ITA KOS LTU LUX LVA MDA MKD MNE NLD NOR POL PRT ROU RUS SRB SVK SVN SWE UKR'.split(' ').forEach(c=>CONTINENT_OF[c]='Eropa');
'ARG BLZ BOL BRA CAN CHL COL CRI CUB DOM ECU GTM GUF GUY HND HTI JAM MEX NIC PAN PER PRI PRY SLV SUR TTO URY USA VEN'.split(' ').forEach(c=>CONTINENT_OF[c]='Amerika');
'AGO BDI BEN BFA BWA CAF CIV CMR COD COG CPV DJI DZA EGY ERI ETH GAB GHA GIN GMB GNQ KEN LBR LBY LSO MAR MDG MLI MOZ MRT MUS MWI NAM NER NGA RWA SDN SEN SLE SOM SSD SWZ SYC TCD TGO TUN TZA UGA ZAF ZMB ZWE'.split(' ').forEach(c=>CONTINENT_OF[c]='Afrika');
'AUS FJI NCL NZL PNG SLB VUT WSM'.split(' ').forEach(c=>CONTINENT_OF[c]='Oseania');

function continentAgg(){
  const agg={};
  for(const p of PLANTS){
    const ct=CONTINENT_OF[p.iso]; if(!ct) continue;
    const a=agg[ct]=agg[ct]||{gw:0,ebt:0,nuc:0,byC:{}};
    a.gw+=p.mw; if(EBT.has(p.fuel))a.ebt+=p.mw; if(p.fuel==='Nuclear')a.nuc+=p.mw;
    a.byC[p.iso]=(a.byC[p.iso]||0)+p.mw;
  }
  return agg;
}
function continentInsightHTML(scope){
  const fmt=n=>Math.round(n).toLocaleString('id-ID');
  const agg=continentAgg(); const tot=Object.values(agg).reduce((s,a)=>s+a.gw,0)||1;
  const rows=Object.entries(agg).sort((a,b)=>b[1].gw-a[1].gw);
  if(scope){
    // Konteks benua untuk negara terpilih
    const ct=CONTINENT_OF[scope]; if(!ct||!agg[ct]) return '';
    const a=agg[ct];
    const rankInCt=Object.entries(a.byC).sort((x,y)=>y[1]-x[1]).findIndex(([c])=>c===scope)+1;
    const myGw=a.byC[scope]||0;
    const myEbt=(()=>{let e=0,t=0;for(const p of PLANTS){if(p.iso!==scope)continue;t+=p.mw;if(EBT.has(p.fuel))e+=p.mw;}return t?e/t*100:0;})();
    const ctEbt=a.ebt/a.gw*100;
    return `<div class="story"><div class="story-h">🧭 Konteks Benua · ${ct}</div><ul>
      <li><b>#${rankInCt}</b> kapasitas terbesar di ${ct} (${fmt(myGw/1000)} dari ${fmt(a.gw/1000)} GW benua).</li>
      <li>Bauran EBT <b>${myEbt.toFixed(0)}%</b> — ${myEbt>=ctEbt?'<span class="g">di atas</span>':'<span class="f">di bawah</span>'} rata-rata ${ct} (${ctEbt.toFixed(0)}%).</li>
    </ul></div>`;
  }
  // Tabel + narasi dunia
  const table=rows.map(([ct,a])=>{
    const top=Object.entries(a.byC).sort((x,y)=>y[1]-x[1])[0];
    return `<tr><td><b>${ct}</b></td><td class="n">${fmt(a.gw/1000)} GW</td><td class="n">${(a.gw/tot*100).toFixed(0)}%</td>
      <td class="n">${(a.ebt/a.gw*100).toFixed(0)}%</td><td>${(COUNTRIES[top[0]]||top[0]).replace(' of America','')}</td></tr>`;
  }).join('');
  const big=rows[0];
  const greenest=rows.filter(([,a])=>a.gw>50e3).sort((a,b)=>(b[1].ebt/b[1].gw)-(a[1].ebt/a[1].gw))[0];
  const fossil=rows.filter(([,a])=>a.gw>50e3).sort((a,b)=>(a[1].ebt/a[1].gw)-(b[1].ebt/b[1].gw))[0];
  const nuke=rows.slice().sort((a,b)=>(b[1].nuc/b[1].gw)-(a[1].nuc/a[1].gw))[0];
  const small=rows[rows.length-1], afr=agg['Afrika'];
  const topC=Object.entries(big[1].byC).sort((x,y)=>y[1]-x[1]).slice(0,2).map(([c])=>(COUNTRIES[c]||c).replace(' of America',''));
  return `<h3>Per Benua</h3>
    <table class="ctable"><tr><th>Benua</th><th class="n">Kapasitas</th><th class="n">% Dunia</th><th class="n">EBT</th><th>Terbesar</th></tr>${table}</table>
    <div class="story"><div class="story-h">📌 Apa yang bisa disimpulkan</div><ul>
      <li><b>${big[0]}</b> adalah pusat gravitasi listrik dunia — <b>${(big[1].gw/tot*100).toFixed(0)}%</b> kapasitas global (${fmt(big[1].gw/1000)} GW), dipimpin ${topC.join(' & ')}. Namun bauran EBT-nya baru <span class="f">${(big[1].ebt/big[1].gw*100).toFixed(0)}%</span> — medan utama transisi energi global.</li>
      <li><b>${greenest[0]}</b> benua besar terhijau: <span class="g">${(greenest[1].ebt/greenest[1].gw*100).toFixed(0)}% EBT</span>, ditopang hidro &amp; angin — bukti dekarbonisasi skala benua itu mungkin.</li>
      <li><b>${nuke[0]}</b> paling mengandalkan <b>nuklir</b> (${(nuke[1].nuc/nuke[1].gw*100).toFixed(0)}% kapasitasnya) sebagai energi rendah karbon.</li>
      <li><b>${afr?'Afrika':small[0]}</b> baru ${afr?(afr.gw/tot*100).toFixed(0):(small[1].gw/tot*100).toFixed(0)}% kapasitas dunia padahal ±18% populasi — ketimpangan akses listrik sekaligus pasar pertumbuhan terbesar dekade ini.</li>
      <li>Pola peta: titik menumpuk di pesisir &amp; lembah sungai (pendingin, hidro, beban kota); <b>Indonesia</b> tampak didominasi batu bara di Jawa — konteks penting target EBT 23%.</li>
    </ul></div>`;
}

    <div style="display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;margin-top:8px">
      <span><span class="mdot" style="background:#2ca02c"></span>EBT ${eb.toFixed(1)}%</span>
      <span><span class="mdot" style="background:#5a5a5a"></span>Fosil ${fo.toFixed(1)}%</span>

    <button class="closeb" onclick="document.getElementById('mix-modal').classList.remove('show')">Tutup</button>
    <p style="margin-top:14px;font-size:11px;color:#6b7184">Sumber: pembangkit — <strong>WRI Global Power Plant Database</strong> (≈34.900 pembangkit, 2021); interkoneksi — <strong>The Global Transmission Database</strong> (MIT). Untuk edukasi &amp; eksplorasi.</p>`;
  document.getElementById('mix-modal').classList.add('show');
}

// ============================================================
// SUMBER & LAYER EKSTERNAL (deep-link kontekstual ke 4 sumber)
// ============================================================

function showSources(){
  const c=map.getCenter(), z=Math.max(2,Math.round(map.getZoom()));
  const lat=c.lat.toFixed(3), lon=c.lng.toFixed(3);
  const iso=state.country, iso2=iso?ISO3_2[iso]:null, cname=iso?(COUNTRIES[iso]||iso):'dunia';
  const oim=`https://openinframap.org/#${z}/${lat}/${lon}`;
  const em = iso2?`https://app.electricitymaps.com/zone/${iso2}`:`https://app.electricitymaps.com/map`;
  const card=(used,icon,title,desc,href,lic)=>`<a class="srccard ${used?'srcused':''}" href="${href}" target="_blank" rel="noopener">
    <span class="si">${icon}</span><span class="st"><span class="stt">${title} <span class="ext">↗</span></span>
    <span class="sd">${desc}</span><span class="badge-lic">${lic}</span></span></a>`;
  const emDesc='Intensitas karbon &amp; bauran listrik real-time per zona'+(iso2?` — langsung ke zona ${cname}`:'')+'.';
  document.getElementById('src-content').innerHTML=`
    <h2>Sumber &amp; <b>Layer Eksternal</b></h2>
    <p>Peta ini menggabungkan beberapa sumber terbuka tanpa duplikasi. Tautan di bawah membuka view saat ini${iso?` (fokus <strong>${cname}</strong>)`:''} di layanan aslinya.</p>
    <h3>Layer aktif di peta ini</h3>
    <div class="srcgrid">
      ${card(true,'🏭','WRI Global Power Plant Database','Pembangkit dunia (kapasitas, bahan bakar, koordinat) — basis lapisan pembangkit.','https://github.com/wri/global-power-plant-database','CC-BY 4.0 · dataset')}
      ${card(true,'⚡','The Global Transmission Database','Interkoneksi antar-negara/region (existing + planned) — basis lapisan grid. Diindeks oleh Awesome-Electrical-Grid-Mapping.','https://github.com/Electricity-Transmission-Database/electricity-transmission-database','MIT · dataset')}
    </div>
    <h3>Layer eksternal (buka di sumbernya)</h3>
    <div class="srcgrid">
      ${card(false,'🌐','Open Infrastructure Map','Transmisi &amp; gardu detail dari OpenStreetMap. Tile diproteksi hotlink, jadi dibuka langsung pada view peta saat ini.',oim,'OSM ODbL · peta live')}
      ${card(false,'💨','Electricity Maps',emDesc,em,'API/peta real-time')}
      ${card(false,'🛰️','Gridfinder','Prediksi jaringan listrik MV/LV global (nighttime lights + OSM) — berguna untuk wilayah berdata minim.','https://gridfinder.org/','MIT · model prediksi')}
      ${card(false,'🤝','MapYourGrid','Inisiatif memperluas cakupan grid transmisi dunia di OpenStreetMap (≈70%→98%). Pelajari &amp; berkontribusi.','https://www.mapyourgrid.org/','inisiatif terbuka')}
    </div>
    <button class="closeb" onclick="document.getElementById('src-modal').classList.remove('show')">Tutup</button>
    <p style="margin-top:14px;font-size:11px;color:#6b7184">Kurasi sumber: <a href="https://github.com/open-energy-transition/Awesome-Electrical-Grid-Mapping" target="_blank" rel="noopener" style="color:#9aa0b4;">Awesome-Electrical-Grid-Mapping</a>. Hak cipta &amp; lisensi tetap pada pemilik masing-masing data.</p>`;
  document.getElementById('src-modal').classList.add('show');
}

// ============================================================
// POTENSI ENERGI TERBARUKAN (global)
// atlite (PyPSA) = library Python yang mengubah data cuaca ERA5 jadi potensi
// angin/surya/hidro (capacity factor). Bukan peta web, jadi ditautkan sebagai
// mesin model + atlas potensi yang bisa langsung dilihat untuk view saat ini.
// ============================================================
function showPotensi(){
  const c=map.getCenter(), z=Math.min(11,Math.max(2,Math.round(map.getZoom())));
  const lat=c.lat.toFixed(3), lon=c.lng.toFixed(3);
  const iso=state.country, cname=iso?(COUNTRIES[iso]||iso):'dunia';
  const gsa=`https://globalsolaratlas.info/map?c=${lat},${lon},${z}`;
  const gwa=iso?`https://globalwindatlas.info/en/area/${encodeURIComponent(cname)}`:'https://globalwindatlas.info/en/';
  const card=(icon,title,desc,href,lic)=>`<a class="srccard" href="${href}" target="_blank" rel="noopener">
    <span class="si">${icon}</span><span class="st"><span class="stt">${title} <span class="ext">↗</span></span>
    <span class="sd">${desc}</span><span class="badge-lic">${lic}</span></span></a>`;
  const gsaDesc='Iradiasi &amp; potensi PV (surya) global'+(iso?` — fokus <strong>${cname}</strong>`:'')+'. Buka di koordinat tengah peta saat ini. Sumber: ESMAP / World Bank.';
  const gwaDesc=iso?`Kecepatan &amp; kelas angin untuk <strong>${cname}</strong> (jika tersedia). Sumber: DTU Wind Energy.`:'Kecepatan &amp; kelas angin dunia per ketinggian — pilih negara/area di situs. Sumber: DTU Wind Energy.';
  document.getElementById('pot-content').innerHTML=`
    <h2>Potensi <b>Energi Terbarukan</b></h2>
    <p><strong>Potensi EBT</strong> = seberapa besar listrik yang bisa dihasilkan matahari, angin, &amp; air di suatu lokasi (capacity factor / iradiasi / kecepatan angin). Tautan di bawah membuka atlas potensi pada view saat ini${iso?` (fokus <strong>${cname}</strong>)`:''}.</p>
    <h3>Lihat potensi (atlas live)</h3>
    <div class="srcgrid">
      ${card('☀️','Global Solar Atlas',gsaDesc,gsa,'Surya · peta live')}
      ${card('💨','Global Wind Atlas',gwaDesc,gwa,'Angin · peta live')}
    </div>
    <h3>Model &amp; sumber terbuka</h3>
    <div class="srcgrid">
      ${card('🛰️','atlite (PyPSA)','Library Python terbuka: ubah data cuaca <strong>ERA5</strong> jadi potensi angin, surya &amp; hidro (capacity factor per lokasi/waktu) — mesin di balik pemodelan sistem energi PyPSA.','https://github.com/PyPSA/atlite','Python · MIT/GPL')}
      ${card('📘','Dokumentasi atlite','Panduan cutout ERA5, konversi PV/wind/hydro, &amp; contoh notebook untuk menghitung potensi kustom.','https://atlite.readthedocs.io/','Docs')}
    </div>
    <button class="closeb" onclick="document.getElementById('pot-modal').classList.remove('show')">Tutup</button>
    <p style="margin-top:14px;font-size:11px;color:#6b7184">Catatan: atlite adalah <em>library</em> (dijalankan di Python), bukan peta web — untuk melihat potensi secara visual gunakan tautan atlas di atas. Hak cipta &amp; lisensi pada pemilik masing-masing.</p>`;
  document.getElementById('pot-modal').classList.add('show');
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape'){
  document.getElementById('mix-modal').classList.remove('show');
  document.getElementById('src-modal').classList.remove('show');
  document.getElementById('pot-modal').classList.remove('show');
  document.getElementById('detail').classList.remove('show'); } });
