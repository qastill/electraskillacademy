<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wiring Lab — Electra Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0f17;--bg2:#10151f;--panel:#141b27;--panel2:#1a2433;--line:#26344a;--line2:#33445f;
    --gold:#e8b339;--gold-d:#b8860b;--gold-soft:#f3d27a;--copper:#c9763b;--txt:#e7edf6;--txt-d:#8ea0b8;--txt-dd:#5b6b82;
    --ok:#3ddc84;--err:#ff5d5d;--err-d:#33161a;--live:#ffd34d;--r:14px}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;
    background-image:radial-gradient(1200px 600px at 80% -10%,rgba(232,179,57,.06),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(201,118,59,.05),transparent 60%),linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:auto,auto,40px 40px,40px 40px;background-blend-mode:normal,normal,overlay,overlay}
  .wrap{max-width:1220px;margin:0 auto;padding:18px 14px 70px}
  header{display:flex;align-items:center;gap:13px;margin-bottom:14px;flex-wrap:wrap}
  .bolt{width:42px;height:42px;border-radius:11px;background:linear-gradient(145deg,var(--gold),var(--gold-d));display:grid;place-items:center;box-shadow:0 6px 22px rgba(232,179,57,.35)}
  .bolt svg{width:22px;height:22px}
  .brand h1{font-family:'Chakra Petch',sans-serif;font-size:20px;letter-spacing:.5px}
  .brand h1 span{color:var(--gold)}
  .brand p{font-size:11.5px;color:var(--txt-d);margin-top:2px}
  .lvl{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gold-soft);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 13px}
  .layout{display:grid;grid-template-columns:1fr 320px;gap:15px;align-items:start}
  @media(max-width:920px){.layout{grid-template-columns:1fr}}
  .card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .card h3{font-family:'Chakra Petch',sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:11px}
  .board-wrap{background:radial-gradient(circle at 50% 25%,#0e131d,#080b11);border:1px solid var(--line2);border-radius:12px;padding:8px;overflow:hidden}
  #board{width:100%;height:auto;display:block;touch-action:manipulation}
  .term .hit{fill:transparent;cursor:pointer}
  .term .dot{fill:#0a0e16;stroke:var(--gold-d);stroke-width:2;transition:.15s}
  .term:hover .dot{stroke:var(--gold);r:7}
  .term.sel .dot{fill:var(--gold);stroke:#fff;r:7.5}
  .term.hl .dot{stroke:#fff;fill:var(--gold);r:7.5}
  .term.hl .hit{fill:rgba(232,179,57,.12)}
  .term.lv .dot{fill:var(--live);stroke:#ffe08a}
  .wire{cursor:pointer}
  .flow{animation:flow 1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-20}}
  .spin{transform-origin:center;transform-box:fill-box;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spin-rev{transform-origin:center;transform-box:fill-box;animation:spinrev .8s linear infinite}
  @keyframes spinrev{to{transform:rotate(-360deg)}}
  .legend{display:flex;flex-wrap:wrap;gap:7px 13px;margin-top:10px}
  .lg{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--txt-d);font-family:'JetBrains Mono',monospace}
  .lgdot{width:15px;height:4px;border-radius:3px}
  .btn{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:13px;border:1px solid var(--line2);background:var(--panel2);color:var(--txt);padding:10px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .btn.primary{background:linear-gradient(145deg,var(--gold),var(--gold-d));color:#1a1206;border-color:var(--gold)}
  .btn:hover{border-color:var(--gold-d)}
  .wbtns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
  .toggle{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--txt-d);margin-left:auto}
  .sw{width:42px;height:23px;border-radius:99px;background:var(--line2);position:relative;cursor:pointer;transition:.2s}
  .sw::after{content:"";position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;background:#0a0e16;transition:.2s}
  .sw.on{background:var(--gold)}.sw.on::after{left:21px;background:#1a1206}
  .fb{margin-top:12px;border-radius:10px;font-size:13px;line-height:1.5}
  .fb.ok{background:rgba(61,220,132,.1);border:1px solid #1c5b3a;color:#bff0d2;padding:12px 14px}
  .fb.err{background:var(--err-d);border:1px solid #7a2c34;color:#ffc9cc;padding:12px 14px}
  .hintbar{font-size:12px;color:var(--gold-soft);font-family:'JetBrains Mono',monospace;margin:2px 0 10px}
  .step{display:flex;gap:10px;margin-bottom:8px;font-size:12.5px;color:var(--txt-d);transition:.15s}
  .step .si{flex-shrink:0;width:24px;height:24px;border-radius:7px;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--gold-soft)}
  .step.done{opacity:.5}.step.done .si{background:var(--ok);color:#06140d;border-color:var(--ok)}
  .step.next .si{background:var(--gold);color:#1a1206;border-color:var(--gold)}
  .step .why{font-size:11px;color:var(--txt-dd);margin-top:3px;line-height:1.45}
  .tut h4{font-family:'Chakra Petch',sans-serif;font-size:12.5px;color:var(--gold-soft);margin:14px 0 6px}
  .tut p,.tut li{font-size:12.5px;color:var(--txt-d);line-height:1.6}
  .tut ul{padding-left:18px;margin:4px 0}
  .tut .badge{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--gold-soft);background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:2px 7px;margin:2px 3px 2px 0}
  .phasebar{display:flex;gap:8px;margin:10px 0 0}
  .phase{flex:1;text-align:center;font-family:'Chakra Petch',sans-serif;font-size:12px;font-weight:600;padding:8px;border-radius:9px;background:var(--bg);border:1px solid var(--line);color:var(--txt-dd)}
  .phase.on{background:linear-gradient(135deg,rgba(232,179,57,.18),transparent);border-color:var(--gold-d);color:var(--gold-soft)}
  .foot{text-align:center;color:var(--txt-dd);font-size:12px;margin-top:26px}
  .foot b{color:var(--gold-soft)}
  .picker{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .pick{font-family:'Chakra Petch',sans-serif;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--txt-d);padding:9px 13px;border-radius:9px;cursor:pointer}
  .pick.on{background:linear-gradient(145deg,var(--gold),var(--gold-d));color:#1a1206;border-color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="bolt"><svg viewBox="0 0 24 24" fill="none"><path d="M13 2L4.5 13.5H11L10 22L19.5 9.5H13L13 2Z" fill="#1a1206" stroke="#1a1206" stroke-width="1.2" stroke-linejoin="round"/></svg></div>
    <div class="brand"><h1>Wiring <span id="labName">Lab</span></h1><p id="labSub">Latihan merangkai panel listrik · Electra Academy</p></div>
    <div class="lvl" id="labLvl">—</div>
  </header>

  <div class="picker" id="picker"></div>

    <div>
      <div class="card">
        <div class="hintbar" id="hint">Ketuk satu terminal lalu terminal lain untuk membuat kabel.</div>
        <div class="board-wrap"><svg id="board" viewBox="0 0 980 620" preserveAspectRatio="xMidYMid meet"></svg></div>
        <div class="legend" id="legend"></div>
        <div class="phasebar" id="phasebar" style="display:none"></div>
        <div class="wbtns">
          <button class="btn primary" id="btnCheck">✓ Periksa &amp; Jalankan</button>
          <button class="btn" id="btnAuto">Contoh benar</button>
          <button class="btn" id="btnReset">Reset</button>
          <div class="toggle"><span>Sorot langkah</span><div class="sw" id="guideTog"></div></div>
        </div>
        <div class="fb" id="fb"></div>
      </div>
    </div>
    <div>
      <div class="card">
        <h3>Langkah Wiring</h3>
        <div id="steps"></div>
      </div>
      <div class="card" style="margin-top:14px">
        <h3>Tutorial &amp; Penjelasan</h3>
        <div class="tut" id="tut"></div>
      </div>
    </div>
  </div>
  <div class="foot">Wiring Lab · <b>Electra Skill Academy</b> · latihan • penjelasan • simulasi</div>
</div>

<script>

      {k:'Ri',side:'l',f:0.22,lbl:'R'},{k:'Si',side:'l',f:0.5,lbl:'S'},{k:'Ti',side:'l',f:0.78,lbl:'T'},
      {k:'Ro',side:'r',f:0.22},{k:'So',side:'r',f:0.5},{k:'To',side:'r',f:0.78}
    ]};
}

/* terminal absolute coords */
function termXY(inst, t){
  const c=COMP[inst.type]; const x=inst.x, y=inst.y, w=c.w, h=c.h;
  if(t.side==='l')return [x, y+t.f*h];
  if(t.side==='r')return [x+w, y+t.f*h];
  if(t.side==='t')return [x+t.f*w, y];
  return [x+t.f*w, y+h];
}
function tlblPos(t){ // label offset relative to terminal
  if(t.side==='l')return [-12,3,'end'];
  if(t.side==='r')return [12,3,'start'];
  if(t.side==='t')return [0,-10,'middle'];
  return [0,16,'middle'];
}

/* ---------- state ---------- */
let LAB=null, wires=[], sel=null, checked=false, energized=false, guideHL=false;
let swState={}, phase='off', seqTimer=null;
const T={}, TROLE={}, TNET={};   // terminal -> coords/role/net

function buildIndex(){
  for(const k in T)delete T[k];
  for(const k in TROLE)delete TROLE[k];
  for(const k in TNET)delete TNET[k];
  LAB.comps.forEach(inst=>{
    COMP[inst.type].terms.forEach(t=>{ T[inst.id+'.'+t.k]=termXY(inst,t); });
  });
  LAB.nets.forEach((nt,i)=>nt.t.forEach(tk=>{TROLE[tk]=nt.role;TNET[tk]=i;}));
}

/* ---------- union-find ---------- */
function uf(){const p={};const f=x=>p[x]===undefined?(p[x]=x):(p[x]===x?x:(p[x]=f(p[x])));
  return {u:(a,b)=>{p[f(a)]=f(b);},c:(a,b)=>f(a)===f(b)};}
function baseUF(){const u=uf();(LAB.given||[]).forEach(w=>u.u(w[0],w[1]));wires.forEach(w=>u.u(w.a,w.b));return u;}

function validate(){
  const u=baseUF();
  for(const nt of LAB.nets){for(let i=1;i<nt.t.length;i++)if(!u.c(nt.t[0],nt.t[i]))return {ok:false,reason:'incomplete'};}
  for(let i=0;i<LAB.nets.length;i++)for(let j=i+1;j<LAB.nets.length;j++)
    if(u.c(LAB.nets[i].t[0],LAB.nets[j].t[0]))return {ok:false,reason:'cross'};
  return {ok:true};
}
function nextTarget(){const u=baseUF();
  for(const nt of LAB.nets){for(let i=1;i<nt.t.length;i++)if(!u.c(nt.t[0],nt.t[i]))return {a:nt.t[0],b:nt.t[i],net:nt};}
  return null;}

/* ---------- simulation: live terminals depend on closed switches/contactors ---------- */
function simUF(closed){
  const u=baseUF();
  LAB.comps.forEach(inst=>{const kind=COMP[inst.type].kind;const id=inst.id;
    if(kind==='pass'){u.u(id+'.Ri',id+'.Ro');u.u(id+'.Si',id+'.So');u.u(id+'.Ti',id+'.To');}
    else if(kind==='sw3'){ if(closed[id]!==false){u.u(id+'.Ri',id+'.Ro');u.u(id+'.Si',id+'.So');u.u(id+'.Ti',id+'.To'); if(T[id+'.Ni']&&T[id+'.No'])u.u(id+'.Ni',id+'.No');} } // 4 kutub (mis. RCBO) ikut menjembatani N
    else if(kind==='sw3aux'){ if(closed[id]){u.u(id+'.Ri',id+'.Ro');u.u(id+'.Si',id+'.So');u.u(id+'.Ti',id+'.To');u.u(id+'.x1',id+'.x2');} } // kontak bantu 13-14 ikut menutup (seal-in)
    else if(kind==='star'){ if(closed[id]){u.u(id+'.y1',id+'.y2');u.u(id+'.y2',id+'.y3');} }
    else if(kind==='delta'){ if(closed[id]){u.u(id+'.l1',id+'.m1');u.u(id+'.l2',id+'.m2');u.u(id+'.l3',id+'.m3');} }
    else if(kind==='cpass'){ u.u(id+'.in',id+'.out'); } // kontak NC (STOP/E-STOP/OL 95-96) — normal tertutup
    else if(kind==='sw'){ if(closed[id]!==false)u.u(id+'.in',id+'.out'); }
    else if(kind==='plc'){ u.u(id+'.Lp',id+'.Qc'); } // suplai output (3L+) di-jumper internal dari L+
    else if(kind==='cb'){ if(closed[id]!==false){u.u(id+'.Ri',id+'.Ro');u.u(id+'.Si',id+'.So');u.u(id+'.Ti',id+'.To');} } // PMT/PMK: menutup kecuali saat trip; coil x1-x2 = beban (tak menjembatani)
    else if(kind==='grid'){ u.u(id+'.R',id+'.Ro');u.u(id+'.S',id+'.So');u.u(id+'.T',id+'.To'); } // busbar grid: rel terhubung
    else if(kind==='rcd'){ if(closed[id]!==false){u.u(id+'.Li',id+'.Lo');u.u(id+'.Ni',id+'.No');} } // RCD: meneruskan L & N kecuali trip
    else if(kind==='appliance'){ u.u(id+'.L',id+'.N'); } // beban: arus mengalir L→N lewat peralatan
    else if(kind==='sw2p'){ if(closed[id]!==false){u.u(id+'.pi',id+'.po');u.u(id+'.ni',id+'.no');} } // isolator 2 kutub DC
    else if(kind==='pass2'){ u.u(id+'.Li',id+'.Lo');u.u(id+'.Ni',id+'.No'); } // meter 2 kutub: lewat
    else if(kind==='meter3'){ if(T[id+'.Li']&&T[id+'.Lo']){u.u(id+'.Li',id+'.Lo');u.u(id+'.Ni',id+'.No');} } // smart meter seri: L/N lewat (analyzer tap sejajar tak menjembatani)
    else if(kind==='load3'){ u.u(id+'.R',id+'.S');u.u(id+'.S',id+'.T'); } // beban 3φ: titik bintang internal
    else if(kind==='logger'){ /* endpoint data, tidak menjembatani daya */ }
    else if(kind==='grid1'){ /* sumber 1φ (lihat liveSet) */ }
    else if(kind==='gtinv'){ /* DC→AC: sisi AC jadi sumber saat generate (lihat phaseSrc) */ }
    else if(kind==='earth'){ /* node PE tunggal, tidak menjembatani */ }
    else if(kind==='charger'){ /* AC→DC: output DC jadi sumber saat fase charge (lihat phaseSrc) */ }
    else if(kind==='bms'){ u.u(id+'.bp',id+'.pp');u.u(id+'.bn',id+'.pn'); } // BMS meneruskan daya (proteksi); B↔P
    else if(kind==='pcs'){ /* DC↔AC: sisi AC jadi sumber saat discharge (lihat phaseSrc) */ }
    // kind 'coil'/'load'/'relay'/'sync'/'ct secondary' = beban/sensor, tidak menjembatani
  });
  return u;
}
function liveSet(closed){
  const s=new Set(); if(!energized)return s;
  const u=simUF(closed);
  // semua sumber (daya 3φ & kontrol) dianggap live
  const srcTerms=[];
  LAB.comps.forEach(c=>{ const k=COMP[c.type].kind; if(k==='src'||k==='grid'||k==='grid1')COMP[c.type].terms.forEach(t=>srcTerms.push(c.id+'.'+t.k)); });
  // sumber tambahan tergantung fase (mis. OUTPUT PLC yang aktif saat ladder jalan)
  if(LAB.phaseSrc&&LAB.phaseSrc[phase])LAB.phaseSrc[phase].forEach(t=>srcTerms.push(t));
  Object.keys(T).forEach(tk=>{ if(srcTerms.some(st=>u.c(tk,st)))s.add(tk); });
  return s;
}

/* ---------- render ---------- */
function wireColor(a,b){const ra=TROLE[a],rb=TROLE[b];if(ra&&rb&&ra===rb)return LAB.roleColor[ra]||'#c9763b';if(ra&&rb&&ra!==rb)return '#ff5d5d';return '#c9763b';}
function draw(){
  const closed=currentClosed();
  const live=liveSet(closed);
  let s='';
  // user wires
  wires.forEach((w,i)=>{const A=T[w.a],B=T[w.b];if(!A||!B)return;const col=wireColor(w.a,w.b);
    const isLive=live.has(w.a)&&live.has(w.b);
    const mx=(A[0]+B[0])/2;
    const d=`M${A[0]} ${A[1]} C ${mx} ${A[1]}, ${mx} ${B[1]}, ${B[0]} ${B[1]}`;
    s+=`<path class="wire" data-w="${i}" d="${d}" fill="none" stroke="${col}" stroke-width="3.2" stroke-linecap="round"/>`;
    if(isLive)s+=`<path class="flow" d="${d}" fill="none" stroke="#ffe08a" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>`;});
  // components
  LAB.comps.forEach(inst=>{s+=drawComp(inst,closed,live);});
  // terminals
  const tgt=guideHL?nextTarget():null;
  LAB.comps.forEach(inst=>{COMP[inst.type].terms.forEach(t=>{
    const tk=inst.id+'.'+t.k;const c=T[tk];const x=c[0],y=c[1];
    const sl=sel===tk?'sel':'';const hl=tgt&&(tgt.a===tk||tgt.b===tk)?'hl':'';const lv=live.has(tk)?'lv':'';
    const lp=tlblPos(t);
    s+=`<g class="term ${sl} ${hl} ${lv}" data-t="${tk}"><circle class="hit" cx="${x}" cy="${y}" r="15"/><circle class="dot" cx="${x}" cy="${y}" r="5.5"/>`+
       (t.lbl?`<text x="${x+lp[0]}" y="${y+lp[1]}" text-anchor="${lp[2]}" font-size="9.5" fill="#8ea0b8" font-family="JetBrains Mono,monospace">${t.lbl}</text>`:'')+`</g>`;});});
  const b=document.getElementById('board');b.innerHTML=s;
  b.querySelectorAll('[data-t]').forEach(e=>e.addEventListener('click',ev=>{ev.stopPropagation();tapT(e.getAttribute('data-t'));}));
  b.querySelectorAll('[data-w]').forEach(e=>e.addEventListener('click',ev=>{ev.stopPropagation();delW(+e.getAttribute('data-w'));}));
}
function box(x,y,w,h,stroke){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="#141b27" stroke="${stroke||'#33445f'}" stroke-width="2"/>`;}
function drawComp(inst,closed,live){
  const c=COMP[inst.type],x=inst.x,y=inst.y,w=c.w,h=c.h,kind=c.kind;
  const on=closed[inst.id];
  let stroke='#33445f', accent='#8ea0b8';
  if(kind==='sw3'||kind==='sw'){ if(on!==false){stroke='#3ddc84';accent='#3ddc84';} }
  if((kind==='star'||kind==='delta'||kind==='sw3aux')&&on){stroke=LAB.roleColor.cmd||'#ffd34d';accent='#ffd34d';}
  if(kind==='src'){stroke='#3ddc84';accent='#3ddc84';}
  if(kind==='cpass'){stroke='#5b8cff';accent='#9db4ff';}
  const coilEn=kind==='coil'&&live.has(inst.id+'.A1')&&live.has(inst.id+'.A2');
  if(coilEn){stroke=LAB.roleColor.cmd||'#ffd34d';accent='#ffd34d';}
  const loadEn=kind==='load'&&live.has(inst.id+'.a')&&live.has(inst.id+'.b');
  if(loadEn){stroke='#ffd34d';accent='#ffd34d';}
  const vfdRun=kind==='vfd'&&energized&&phase!=='off';

    s+=`<text x="${cx}" y="${y+h*0.74+14}" text-anchor="middle" font-size="9" fill="${syn||closed2?'#3ddc84':'#f3d27a'}" font-family="JetBrains Mono">${msg}</text>`;
  }
  s+=`</g>`;
  return s;
}

/* contactor/breaker closed-state for current phase */
function currentClosed(){
  const cl={};
  LAB.comps.forEach(inst=>{const kind=COMP[inst.type].kind;
    // Komponen ber-flag no:true (normally-open) default LEPAS — hanya menutup
    // saat fasenya aktif. Tanpa flag, MCB/saklar/kontaktor utama default ON.
    if(inst.no)cl[inst.id]=false;
    else if(kind==='sw3'||kind==='sw')cl[inst.id]=swState[inst.id]!==false; // default ON
    else cl[inst.id]=false;});
  if(energized&&LAB.phaseClosed&&LAB.phaseClosed[phase]){LAB.phaseClosed[phase].forEach(id=>cl[id]=true);}
  return cl;
}

/* ---------- interactions ---------- */
function tapT(tk){
  if(sel===null){sel=tk;hint('Pilih terminal lain untuk menyambung, atau ketuk lagi untuk batal.');draw();return;}
  if(sel===tk){sel=null;draw();return;}
  if(!wires.some(w=>(w.a===sel&&w.b===tk)||(w.a===tk&&w.b===sel)))wires.push({a:sel,b:tk});
  sel=null;stopSeq();checked=false;energized=false;phase='off';draw();updateGuide();updatePhase();
}
function delW(i){wires.splice(i,1);stopSeq();checked=false;energized=false;phase='off';draw();updateGuide();updatePhase();}
function hint(t){document.getElementById('hint').textContent=t;}

function updateGuide(){
  const tgt=nextTarget();const curNet=tgt?tgt.net:null;
  const el=document.getElementById('steps');
  el.innerHTML=LAB.guide.map((g,i)=>{
    const net=LAB.nets[g.net];const u=baseUF();const done=net?net.t.every((t,k)=>k===0||u.c(net.t[0],t)):false;
    const isNext=curNet&&net===curNet;
    return `<div class="step ${done?'done':''} ${isNext?'next':''}"><div class="si">${done?'✓':i+1}</div><div class="stx">${g.txt}<div class="why">${g.why}</div></div></div>`;
  }).join('');
}

/* ---------- sequence runner (e.g. star -> delta) ---------- */
function stopSeq(){if(seqTimer){clearTimeout(seqTimer);seqTimer=null;}}
function runSequence(){
  stopSeq();
  if(!LAB.sequence){phase='run';draw();updatePhase();return;}
  let idx=0;
  const step=()=>{
    if(idx>=LAB.sequence.length){return;}
    const sp=LAB.sequence[idx];phase=sp.phase;draw();updatePhase();
    if(idx<LAB.sequence.length-1){seqTimer=setTimeout(()=>{idx++;step();},sp.ms||2600);}
  };
  step();
}
function updatePhase(){
  const bar=document.getElementById('phasebar');
  if(!LAB.phases){bar.style.display='none';return;}
  bar.style.display='flex';
  bar.innerHTML=LAB.phases.map(p=>`<div class="phase ${energized&&phase===p.key?'on':''}">${p.label}</div>`).join('');
}

/* ---------- check / auto / reset ---------- */
function check(){
  const v=validate();const fb=document.getElementById('fb');
  if(v.ok){checked=true;energized=true;runSequence();
    fb.className='fb ok';fb.innerHTML=LAB.okMsg||'<b>✓ Wiring benar!</b> Rangkaian dijalankan.';}
  else{checked=false;energized=false;phase='off';stopSeq();draw();updatePhase();
    fb.className='fb err';
    fb.innerHTML=v.reason==='cross'?'<b>✕ Ada hubung-singkat / salah sambung.</b> Dua titik berbeda tersambung. Ketuk kabel merah untuk menghapus.':'<b>✕ Belum lengkap.</b> Masih ada sambungan kurang — aktifkan "Sorot langkah" untuk dituntun.';}
}
function autoWire(){
  wires=[];LAB.nets.forEach(nt=>{for(let i=1;i<nt.t.length;i++)wires.push({a:nt.t[0],b:nt.t[i]});});
  sel=null;checked=true;energized=true;draw();updateGuide();runSequence();
  const fb=document.getElementById('fb');fb.className='fb ok';fb.innerHTML='<b>Contoh wiring benar dimuat.</b> Pelajari warna &amp; jalurnya, lalu "Reset" dan coba rakit sendiri.';
}
function resetW(){wires=[];sel=null;checked=false;energized=false;phase='off';stopSeq();draw();updateGuide();updatePhase();
  const fb=document.getElementById('fb');fb.className='fb';fb.innerHTML='';}

/* ---------- lab loading ---------- */
function loadLab(id){
  LAB=LABS[id]||LABS[Object.keys(LABS)[0]];
  wires=[];sel=null;checked=false;energized=false;phase='off';guideHL=false;swState={};stopSeq();
  buildIndex();
  document.getElementById('labName').textContent=LAB.short||'Lab';
  document.getElementById('labSub').textContent=LAB.sub||'';
  document.getElementById('labLvl').textContent=LAB.jalur+' · '+(LAB.level||'Profesional');
  document.getElementById('board').setAttribute('viewBox',LAB.vb||'0 0 980 620');
  document.getElementById('legend').innerHTML=Object.keys(LAB.roleLabel||{}).map(r=>`<span class="lg"><span class="lgdot" style="background:${LAB.roleColor[r]}"></span>${LAB.roleLabel[r]}</span>`).join('');
  document.getElementById('tut').innerHTML=LAB.tutorial||'';
  document.getElementById('guideTog').classList.remove('on');
  document.getElementById('fb').className='fb';document.getElementById('fb').innerHTML='';
  draw();updateGuide();updatePhase();
  // picker active state
  document.querySelectorAll('.pick').forEach(b=>b.classList.toggle('on',b.getAttribute('data-lab')===LAB.id));
}

  tutorial:`
    <h4>Apa itu proteksi diferensial (87T)?</h4>
    <p>Proteksi UTAMA trafo daya. Prinsip Hukum Kirchhoff arus: <b>arus yang masuk trafo harus sama dengan yang keluar</b> (setelah dikoreksi rasio belitan). Bila tidak sama → ada gangguan <b>di dalam zona</b> (antara dua CT) → trip.</p>
    <h4>Cara kerja</h4>
    <ul>
      <li>CT di <b>sisi HV</b> mengukur arus masuk; CT di <b>sisi LV</b> mengukur arus keluar.</li>
      <li>Relai 87T menghitung <b>arus diferensial</b> = |I_HV − I_LV| (terkoreksi).</li>
      <li>Normal/gangguan luar: I_HV = I_LV → Idiff ≈ 0 → diam (stabil).</li>
      <li>Gangguan dalam (hubung singkat belitan, flashover): arus bocor → Idiff besar → <b>trip</b>.</li>
    </ul>

    <h4>Tantangan: arus inrush & rasio</h4>
    <ul>
      <li><b>Magnetizing inrush</b> saat trafo baru energize bisa bikin Idiff palsu → relai modern pakai <b>harmonic restraint</b> (blok pada harmonik ke-2).</li>
      <li><b>Koreksi rasio & vektor</b> (mis. Dyn11) & mismatch CT diakomodasi setting/relai numerik.</li>
      <li><b>Slope/bias</b>: makin besar arus through, makin besar ambang Idiff (agar stabil terhadap mismatch CT saat gangguan luar).</li>
    </ul>
    <h4>Zona proteksi</h4>
    <p>Zona 87T = area di antara kedua CT. Gangguan di luar zona ditangani proteksi lain (OCR/distance). Tumpang-tindih zona penting agar tak ada titik buta.</p>
    <h4>Di dunia kerja</h4>
    <p>Engineer proteksi transmisi: setting 87T (slope, harmonic restraint, rasio/vector group), wiring CT-relai-trip, dan uji injeksi (stability test) di GITET — relai mis. SEL-487E, MiCOM P64x, Siemens 7UT.</p>`
};
